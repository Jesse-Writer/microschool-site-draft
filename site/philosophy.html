  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    msg.textContent = "Unlocking\u2026";
    try {
      var html = await unlock(pw);
      try { sessionStorage.setItem(KEY, pw); } catch (err) {}
      show(html);
    } catch (err) {
      msg.textContent = "That password did not work. Check it and try again.";
      document.getElementById("pw").select();
    }
  });

  // Already unlocked earlier this session: go straight through.
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (err) {}
  if (saved) {
    unlock(saved).then(show).catch(function () {
      try { sessionStorage.removeItem(KEY); } catch (err) {}
    });
  }
})();
</script>
</body>
</html>
