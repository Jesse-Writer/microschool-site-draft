      <button type="submit">Unlock</button>

  </form>
  <p id="msg" role="status" aria-live="polite"></p>
</main>

  var KEY = "draft-pw";
  var msg = document.getElementById("msg");

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  async function unlock(password) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(PAYLOAD));
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    msg.textContent = "Unlocking\u2026";
    try {
      var html = await unlock(pw);
      try { sessionStorage.setItem(KEY, pw); } catch (err) {}
      show(html);
    } catch (err) {
      msg.textContent = "That password did not work. Check it and try again.";
      document.getElementById("pw").select();
    }
  });

  // Already unlocked earlier this session: go straight through.
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (err) {}
  if (saved) {
    unlock(saved).then(show).catch(function () {
      try { sessionStorage.removeItem(KEY); } catch (err) {}
    });
  }
})();
